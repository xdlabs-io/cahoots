name: Publish to npm

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Run Test Suite
        run: npm test

  publish:
    name: Publish to npm (OIDC Dual-Publish)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"

      - name: Publish cahoots-mcp (Trusted Publishing / OIDC)
        run: npx npm@latest publish --access public --provenance

      - name: Publish @xdlabs/cahoots (Trusted Publishing / OIDC)
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.name = "@xdlabs/cahoots";
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2), "utf8");
          '
          npx npm@latest publish --access public --provenance || echo "Notice: @xdlabs/cahoots publish step finished."
